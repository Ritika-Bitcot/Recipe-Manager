[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    --durations=10
    --cov=src
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=85
    --env-file=.env.test
    --log-cli-level=INFO
    --log-cli-format=%(asctime)s [%(levelname)8s] %(name)s: %(message)s
    --log-cli-date-format=%Y-%m-%d %H:%M:%S

markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests

    auth: Authentication tests
    recipe: Recipe-related tests
    service: Service layer tests
    repository: Repository/database layer tests
    validation: Data validation tests

    slow: Slow tests (>5s)
    fast: Fast tests (<1s)
    requires_db: Tests requiring database
    requires_auth: Tests requiring authentication

timeout = 300
timeout_method = thread

filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:flask.*
    ignore::PydanticDeprecatedSince20
    ignore::RuntimeWarning:unittest.mock.*

minversion = 3.9