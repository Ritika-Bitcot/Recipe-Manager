services:
  # PostgreSQL Database for Development
  db:
    image: postgres:15-alpine
    container_name: recipe_manager_db_dev
    environment:
      POSTGRES_DB: recipe_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - recipe_manager_dev_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d recipe_dev" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache for Development
  redis:
    image: redis:7-alpine
    container_name: recipe_manager_redis_dev
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - recipe_manager_dev_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Application for Development
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipe_manager_app_dev
    environment:
      # Database Configuration
      DATABASE_URL: postgresql+psycopg2://postgres:password@db:5432/recipe_dev
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: recipe_dev
      DB_USER: postgres
      DB_PASSWORD: password

      # Application Configuration
      SECRET_KEY: dev-secret-key-not-for-production
      ALLOWED_ORIGINS: '["*"]'
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG

      # JWT Configuration
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      # Cache Configuration
      CACHE_TTL: 300
      ENABLE_CACHE: "true"

      # Redis Configuration
      REDIS_URL: redis://redis:6379/0

      # Authentication Bypass for Development
      AUTH_BYPASS_EMAIL: test@example.com

      # Development settings
      FLASK_ENV: development
      FLASK_DEBUG: "true"
    ports:
      - "5001:5000"
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recipe_manager_dev_network
    restart: unless-stopped
    command: [ "python", "-m", "flask", "run", "--host=0.0.0.0", "--port=5000", "--reload" ]

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  recipe_manager_dev_network:
    driver: bridge
