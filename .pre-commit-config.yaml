repos:
- repo: https://github.com/psf/black
  rev: 23.11.0
  hooks:
    - id: black
      exclude: ^migrations/
      args: ["--line-length=120"]

- repo: https://github.com/pycqa/isort
  rev: 5.12.0
  hooks:
    - id: isort
      exclude: ^migrations/
      args: ["--profile", "black", "--line-length=120"]

- repo: https://github.com/PyCQA/flake8
  rev: 6.1.0
  hooks:
    - id: flake8
      exclude: ^migrations/
      args: ["--max-line-length=120", "--config=setup.cfg"]